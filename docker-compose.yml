version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      # For Ollama on the host machine:
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - backend-data:/app/backend/db
      - backend-faiss:/app/backend/data/faiss_index
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-faiss:
